name: Build, release and deploy
# Every push to main: build the FM-1 firmware on Linux, check it with M-VAVE's
# own updater code, publish a GitHub Release when VERSION names a new release,
# and deploy the install page with that build behind "Use latest build".
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: JieLi toolchain, kept between runs
        uses: actions/cache@v4
        with:
          path: ~/.jieli
          key: jieli-linux-toolchain-v1
      - name: Get the toolchain
        run: test -e ~/.jieli/toolchain || sh tools/get_toolchain.sh ~/.jieli
      - name: Build the firmware
        run: JIELI_TOOLCHAIN=~/.jieli/toolchain python3 tools/build_fm1.py --version "${{ steps.v.outputs.version }}"
      - name: Start it in an emulated FM-1 (fm1-emu runs the firmware as it is, M-VAVE's library included)
        run: |
          sudo apt-get install -y -q libasound2-dev >/dev/null
          sh tools/emu_boot.sh build/viscera.fwsc
      - name: Build the browser emulator from the same core
        run: |
          sudo apt-get install -y -q lld >/dev/null
          clang --target=wasm32 -O2 -nostdlib -ffreestanding -fno-builtin-memcpy -Icore \
            -DVSC_VERSION="\"${{ steps.v.outputs.version }}\"" \
            -Wl,--no-entry -Wl,--export=__heap_base -Wl,--initial-memory=8388608 -Wl,--strip-all \
            -o build/viscera.wasm web/vsc_wasm.c core/vsc_engine.c core/vsc_params.c core/vsc_ui.c core/vsc_midi.c
      - name: Build the sample codec for the install page
        run: |
          clang --target=wasm32 -O2 -nostdlib -ffreestanding -fno-builtin -Iweb/sea -isystem web/sea/shim \
            -Wl,--no-entry -Wl,--export=__heap_base -Wl,--strip-all -o site/vendor/sea.wasm web/sea/sea_wasm.c
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Play every page, device, modulator and MIDI path on the same core
        run: node tools/emulator/engine_test.mjs build/viscera.wasm
      - name: Check the package with M-VAVE's updater
        run: node tools/verify_package.mjs build/viscera.fwsc build/latest.json
      - name: Install it through the install page into a simulated FM-1 (from Ravel, stock and Open)
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium >/dev/null
          python3 tools/emulator/flash_test.py
      - name: Round-trip the sample codec
        run: node tools/sea_test.mjs site/vendor/sea.wasm
      - name: Manage samples through the install page on a simulated FM-1
        run: |
          npm install --no-save playwright@$(python -c "import importlib.metadata as m; print(m.version('playwright'))") >/dev/null 2>&1 || npm install --no-save playwright >/dev/null
          npx playwright install chromium >/dev/null
          node tools/emulator/samples_test.mjs site
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/viscera.fwsc
            build/latest.json
            build/fm1-report.json
            build/viscera.wasm

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      V: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: build
      - name: Release this version if it's new
        if: false   # paused until an install is confirmed on hardware
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "v$V is already released; bump VERSION to publish a new release."
            exit 0
          fi
          cp build/viscera.fwsc "build/viscera-$V.fwsc"
          awk -v v="$V" '$0 ~ "^## "v"$" {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          printf '\nInstall it from https://de-pattern.github.io/viscera/ (Chrome or Edge, FM-1 on USB).\n' >> notes.md
          gh release create "v$V" "build/viscera-$V.fwsc" build/fm1-report.json \
            --title "Viscera $V" --notes-file notes.md --target "$GITHUB_SHA"

  pages:
    needs: [build, release]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      V: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: build
      - name: Put this build and every earlier one behind the installer
        run: |
          python3 tools/site_versions.py --build build --site site --seed firmware-archive \
            --live https://de-pattern.github.io/viscera --changelog CHANGELOG.md
          cp build/viscera.wasm site/emulator/viscera.wasm
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
